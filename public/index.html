<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="container py-4">
    <h1 class="mb-4">👥 Usuarios (ReqRes API)</h1>

    <div class="mb-4">
        <button class="btn btn-primary" onclick="fetchUsers()">
            📥 Obtener Usuarios
        </button>
    </div>

    <div class="row mb-5" id="userList"></div>

    <hr>

    <h3>➕ Crear Usuario</h3>
    <form onsubmit="createUser(event)">
        <input type="text" id="name" placeholder="Nombre" class="form-control mb-2" required>
        <input type="text" id="job" placeholder="Trabajo" class="form-control mb-2" required>
        <button class="btn btn-success">Crear</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>

</html>
